# Build the single-file Windows executable and publish it as a GitHub release.
#
# Triggered by a tag like v1.0.3
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:      # lets you rehearse the build without tagging

permissions:
  contents: write         # required to create the release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Deterministic Qt rendering on a runner with no interactive desktop.
      # The bundled Windows platform plugin is checked separately, by --selftest.
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64          # PySide6 publishes no 32-bit Windows wheels
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = python -c "import otpvault; print(otpvault.__version__)"
          # The tag pattern is vX.Y.Z, so a two-part __version__ could never
          # match one — say so plainly instead of reporting a mismatch against a
          # tag this step derived itself.
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "otpvault __version__ is '$version'; release tags are vX.Y.Z, so it needs three numeric parts."
            exit 1
          }
          $expected = "v$version"
          if ($expected -ne "${{ github.ref_name }}") {
            Write-Error "tag ${{ github.ref_name }} does not match otpvault __version__ $version (expected $expected). Bump the version or retag."
            exit 1
          }
          Write-Host "tag ${{ github.ref_name }} matches version $version"

      - name: Run the test suite
        run: python -m pytest -q

      - name: Render the application icon
        run: python tools/make_icon.py

      - name: Build qt-otp.exe
        run: python -m PyInstaller --noconfirm --clean qt-otp.spec

      - name: Smoke-test the executable
        run: |
          # PowerShell does NOT wait for a GUI-subsystem executable: with `&` the
          # next line runs before the process has even started, so $LASTEXITCODE
          # is whatever the previous command left behind. Start-Process -Wait is
          # what actually blocks, and -PassThru gives the real exit code.
          $proc = Start-Process -FilePath .\dist\qt-otp.exe `
            -ArgumentList '--selftest', 'selftest-report.json' `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput selftest-stdout.txt `
            -RedirectStandardError selftest-stderr.txt
          Get-Content selftest-stdout.txt
          if ((Test-Path selftest-stderr.txt) -and (Get-Item selftest-stderr.txt).Length -gt 0) {
            Get-Content selftest-stderr.txt
          }
          if ($proc.ExitCode -ne 0) {
            Write-Error "the built executable failed its self-test (exit $($proc.ExitCode))"
            exit 1
          }
          $report = Get-Content selftest-report.json -Raw | ConvertFrom-Json
          if (-not $report.ok) {
            Write-Error "the self-test report contains a failed check"
            exit 1
          }
          Write-Host "self-test passed on the packaged build"

      - name: Build the NSIS installer
        run: |
          # NSIS ships on the windows runner images; install it only if that
          # ever stops being true, so the normal path costs nothing.
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          if (-not (Test-Path $makensis)) {
            Write-Host "NSIS not found on the image; installing it"
            choco install nsis --no-progress -y
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }

          # VIProductVersion insists on four numeric parts; __version__ has three.
          $version = python -c "import otpvault; print(otpvault.__version__)"
          $parts = @($version -split '\.') + @('0', '0', '0')
          $version4 = ($parts[0..3]) -join '.'

          & $makensis /V2 `
            "/DVERSION=$version" `
            "/DVERSION4=$version4" `
            "/DSRC_EXE=$PWD\dist\qt-otp.exe" `
            "/DICON=$PWD\build\qt-otp.ico" `
            "/DLICENSE_FILE=$PWD\LICENSE" `
            "/DOUT_FILE=$PWD\dist\qt-otp-setup.exe" `
            installer\qt-otp.nsi
          if ($LASTEXITCODE -ne 0) {
            Write-Error "makensis failed (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "built dist\qt-otp-setup.exe for $version"

      - name: Smoke-test the installer
        run: |
          # No spaces in RUNNER_TEMP, which matters: NSIS requires /D= to come
          # last and to carry no quotes, so nothing here may need quoting.
          $dir = "$env:RUNNER_TEMP\qt-otp-install-test"

          $proc = Start-Process -FilePath .\dist\qt-otp-setup.exe `
            -ArgumentList '/S', '/CurrentUser', "/D=$dir" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "the installer failed (exit $($proc.ExitCode))"
            exit 1
          }

          $key = "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\qt-otp"
          foreach ($path in @("$dir\qt-otp.exe", "$dir\Uninstall.exe", $key)) {
            if (-not (Test-Path $path)) {
              Write-Error "the installer did not create $path"
              exit 1
            }
          }
          $entry = Get-ItemProperty $key
          Write-Host "Apps & features entry: $($entry.DisplayName) $($entry.DisplayVersion) -> $($entry.InstallLocation)"

          # The installed copy is the compressed one: prove NSIS round-tripped
          # the executable intact rather than trusting dist\qt-otp.exe's result.
          $proc = Start-Process -FilePath "$dir\qt-otp.exe" `
            -ArgumentList '--selftest', 'installed-selftest.json' `
            -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Error "the installed executable failed its self-test (exit $($proc.ExitCode))"
            exit 1
          }

          # _?= keeps the uninstaller from relaunching itself out of %TEMP%, so
          # this call is synchronous. The price is that it cannot delete itself,
          # which is why $dir is checked for the app rather than for absence.
          $proc = Start-Process -FilePath "$dir\Uninstall.exe" `
            -ArgumentList '/CurrentUser', '/S', "_?=$dir" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "the uninstaller failed (exit $($proc.ExitCode))"
            exit 1
          }
          if (Test-Path "$dir\qt-otp.exe") {
            Write-Error "the uninstaller left qt-otp.exe behind"
            exit 1
          }
          if (Test-Path $key) {
            Write-Error "the uninstaller left the Apps & features entry behind"
            exit 1
          }
          Write-Host "installer round-trip passed: install, self-test, uninstall"

      - name: Name and checksum the assets
        id: asset
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $name = "qt-otp-$tag-windows-x64.exe"
          $setup = "qt-otp-$tag-windows-x64-setup.exe"
          Move-Item dist\qt-otp.exe "dist\$name"
          Move-Item dist\qt-otp-setup.exe "dist\$setup"

          # Writes the sha256 sidecar in the shape `sha256sum -c` expects and
          # returns "<hash> <size in MB>" for the release notes.
          function Publish-Asset($file) {
            $hash = (Get-FileHash "dist\$file" -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File -Encoding ascii "dist\$file.sha256"
            $size = "{0:N1}" -f ((Get-Item "dist\$file").Length / 1MB)
            Write-Host "$file  ($size MB)  sha256=$hash"
            return @($hash, $size)
          }

          $exeHash, $exeSize = Publish-Asset $name
          $setupHash, $setupSize = Publish-Asset $setup

          "name=$name"               | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "sha256=$exeHash"          | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "size=$exeSize"            | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "setup_name=$setup"        | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "setup_sha256=$setupHash"  | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "setup_size=$setupSize"    | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qt-otp-windows-x64
          path: |
            dist/${{ steps.asset.outputs.name }}
            dist/${{ steps.asset.outputs.name }}.sha256
            dist/${{ steps.asset.outputs.setup_name }}
            dist/${{ steps.asset.outputs.setup_name }}.sha256
            selftest-report.json
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag   = "${{ github.ref_name }}"
          $name  = "${{ steps.asset.outputs.name }}"
          $setup = "${{ steps.asset.outputs.setup_name }}"
          @"
          ## qt-otp $tag

          Windows x64. Two ways to get it — both are the same application.

          | Download | | |
          | --- | --- | --- |
          | ``$setup`` | installer | $("${{ steps.asset.outputs.setup_size }}") MB |
          | ``$name`` | portable, single file | $("${{ steps.asset.outputs.size }}") MB |

          The installer puts qt-otp under your own profile by default, so it
          needs no administrator; pick **All users** on the first page to
          install to Program Files instead. It adds a Start menu shortcut and an
          Apps & features entry, and **never touches your vault** — upgrading
          over an existing copy and uninstalling both leave
          ``%APPDATA%\qt-otp`` alone.

          The portable build needs no installation at all: download and run.

          Windows will show a SmartScreen warning either way, because neither
          file is code-signed: choose **More info** then **Run anyway**, or
          verify the download first.

          | | SHA-256 |
          | --- | --- |
          | ``$setup`` | ``$("${{ steps.asset.outputs.setup_sha256 }}")`` |
          | ``$name`` | ``$("${{ steps.asset.outputs.sha256 }}")`` |

          ``````powershell
          (Get-FileHash .\$setup -Algorithm SHA256).Hash
          ``````
          "@ | Out-File -Encoding utf8 release-notes.md

          # Re-runs of a tag should update the existing release, not fail.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag exists; replacing its assets"
            gh release upload $tag `
              "dist/$setup" "dist/$setup.sha256" `
              "dist/$name" "dist/$name.sha256" --clobber
          } else {
            gh release create $tag `
              "dist/$setup" "dist/$setup.sha256" `
              "dist/$name" "dist/$name.sha256" `
              --title "qt-otp $tag" --notes-file release-notes.md --verify-tag
          }
